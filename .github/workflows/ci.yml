name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run Go Vet
        run: |
          cd apps/api
          go vet ./...

      # DB-backed tests skip when TEST_DATABASE_URL is unset. They are run
      # manually against a migrated test database — see runbook §6. CI does not
      # touch a database: `make migrate` stays a manual, operator-run step.
      - name: Run Go Backend Tests
        run: |
          cd apps/api
          go test ./...

      - name: Install Flutter Dependencies
        run: |
          cd apps/app
          flutter pub get

      - name: Generate Flutter Code (build_runner)
        run: |
          cd apps/app
          cp ../../.env.example .env 2>/dev/null || touch .env
          dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter Static Analysis
        run: |
          cd apps/app
          flutter analyze

      - name: Run Flutter Tests
        run: |
          cd apps/app
          flutter test

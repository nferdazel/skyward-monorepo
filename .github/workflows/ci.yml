name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: skyward
          POSTGRES_PASSWORD: skyward
          POSTGRES_DB: skyward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyward"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # DB-backed tests in apps/api skip unless this is set.
      TEST_DATABASE_URL: postgres://skyward:skyward@localhost:5432/skyward_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: Ensure psql is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Apply migrations to the test database
        env:
          DATABASE_URL: postgres://skyward:skyward@localhost:5432/skyward_test
        run: make migrate

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run Go Vet
        run: |
          cd apps/api
          go vet ./...

      - name: Run Go Backend Tests
        run: |
          cd apps/api
          go test ./...

      - name: Install Flutter Dependencies
        run: |
          cd apps/app
          flutter pub get

      - name: Generate Flutter Code (build_runner)
        run: |
          cd apps/app
          cp ../../.env.example .env 2>/dev/null || touch .env
          dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter Static Analysis
        run: |
          cd apps/app
          flutter analyze

      - name: Run Flutter Tests
        run: |
          cd apps/app
          flutter test
